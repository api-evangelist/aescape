contract_discovery:
  performed: '2026-07-31'
  result: no public machine-readable API contract
  hosts_probed:
  - https://www.aescape.com
  - https://aescape.com
  - https://api.aescape.com
  - https://developer.aescape.com
  - https://app.aescape.com
  - https://store.aescape.com
  - https://one.aescape.com
  - https://aescape-8ocoec.zitadel.cloud
  rest_openapi:
    probed: [/openapi.json, /openapi.yaml, /swagger.json, /v1/openapi.json, /api-docs,
      /docs, /redoc, /v1/]
    result: >-
      api.aescape.com answers every path with HTTP 404 application/json
      {"message":"Not Found"} and returns an apigw-requestid response header,
      identifying it as an AWS API Gateway fronting the consumer application. No
      spec is exposed. www.aescape.com returns the Next.js 404 page.
      app.aescape.com returns its Flutter SPA shell (text/html) for every path,
      which does not parse as OpenAPI and is rejected.
  graphql:
    result: 404 on api.aescape.com; app.aescape.com /graphql is the SPA catch-all,
      not a GraphQL endpoint. No introspection performed because no endpoint exists.
  mcp:
    result: no MCP server advertised in docs, on any host, or in the app CSP connect-src
      allowlist.
  a2a:
    result: >-
      /.well-known/agent-card.json and /.well-known/agent.json probed on every host.
      404 on aescape.com, www.aescape.com and api.aescape.com; 401 on
      developer.aescape.com; 200 text/html SPA catch-all on app.aescape.com, which
      fails the AgentCard JSON-object shape test and is rejected as a false
      positive. No agent card exists — nothing was written to a2a/.
  developer_portal:
    host: https://developer.aescape.com
    status: 401
    www_authenticate: Basic realm="Developer Docs"
    result: >-
      Aescape operates a developer documentation site but it is gated behind HTTP
      Basic authentication and fronted by Cloudflare. Every path, including
      /.well-known/*, returns 401. No DeveloperPortal or Documentation pointer is
      wired in apis.yml because nothing on this host is publicly published.
  packages:
    result: >-
      No first-party client library found on npm, PyPI, RubyGems or in the GitHub
      organization. The github.com/aescape-inc organization holds nine public
      repositories, all forks of third-party projects (pusher-channels-flutter,
      flutter_calendar_view, Open3D, mobile_scanner, fluent-bit, consent-manager,
      flutter_map_marker_cluster, open-mail-app-flutter, and an Aescape fork of
      cyclonedds patched for ROS 2 Humble). None is an Aescape SDK, so no SDKs
      pointer is wired.
