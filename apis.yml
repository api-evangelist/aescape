aid: aescape
name: Aescape
description: 'Aescape is a New York City lifestyle-robotics company, founded in 2017
  by Eric Litman, that builds a fully automated AI-powered robotic massage platform.
  Its table uses sensors and computer vision to map over one million 3D data points
  of a person''s body, then drives heated robotic arms through massage techniques at
  a user-selected pressure, duration and focus area, with sessions booked and controlled
  through a mobile/web app. Sessions run 15 to 60 minutes and the tables are deployed
  in Equinox clubs, Four Seasons, Marriott and Ritz-Carlton properties, spas and corporate
  wellness sites across North America, alongside an Aescape One home product. Aescape
  publishes no public developer API: its consumer app is served by a private AWS API
  Gateway host (api.aescape.com) and its developer documentation site (developer.aescape.com)
  is gated behind HTTP Basic auth. The one machine-readable, anonymously reachable
  contract Aescape does publish is the OpenID Connect discovery document for its Zitadel
  identity tenant.'
